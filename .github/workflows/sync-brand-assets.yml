name: Sync approved HowLong logo and SCAI corporate theme
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-brand-assets.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download approved assets from corporate homepage
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error \
            'https://corpororatehomepage.vercel.app/assets/howlong-logo.avif' \
            --output assets/howlong-logo.avif
          curl --fail --location --retry 3 --silent --show-error \
            'https://corpororatehomepage.vercel.app/styles.css' \
            --output corporate-theme.css
          test "$(wc -c < assets/howlong-logo.avif)" -gt 1000
          test "$(wc -c < corporate-theme.css)" -gt 15000
          file assets/howlong-logo.avif
          sha256sum assets/howlong-logo.avif corporate-theme.css
      - name: Save corporate theme and HowLong logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/howlong-logo.avif corporate-theme.css
          if ! git diff --cached --quiet; then
            git commit -m "Add approved HowLong logo and matching SCAI corporate theme"
            git push origin HEAD:main
          fi
